<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML File Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>HTML File Viewer</h1>
            <p>Simple page to display HTML files using iframes.</p>
        </header>

        <main class="viewer-grid">

            <!-- File 1 -->
            <section class="viewer">
                <h2>File 1</h2>
                <iframe
                    src="https://axionb21.github.io/OSCP/path/day1.html"
                    title="HTML File 1">
                </iframe>
            </section>

            <!-- File 2 -->
            <section class="viewer">
                <h2>File 2</h2>
                <iframe
                    src="YOUR_GITHUB_HTML_FILE_PATH_2"
                    title="HTML File 2">
                </iframe>
            </section>

            <!-- File 3 -->
            <section class="viewer">
                <h2>File 3</h2>
                <iframe
                    src="YOUR_GITHUB_HTML_FILE_PATH_3"
                    title="HTML File 3">
                </iframe>
            </section>

            <!-- File 4 -->
            <section class="viewer">
                <h2>File 4</h2>
                <iframe
                    src="YOUR_GITHUB_HTML_FILE_PATH_4"
                    title="HTML File 4">
                </iframe>
            </section>

        </main>
    </div>

</body>
</html>
