<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        input, textarea, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            min-height: 100px;
        }

        button {
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #output {
            height: 500px;
            font-family: monospace;
        }
    </style>
</head>

<body>

    <h1>HTML Page Generator</h1>

    <input id="title" placeholder="Title e.g. Day 1 - Linux Basics">

    <input id="subtitle" placeholder="Subtitle e.g. OSCP Learning Path">

    <textarea id="importance"
        placeholder="Importance"></textarea>

    <textarea id="notes"
        placeholder="Notes - one point per line"></textarea>

    <input id="path"
        placeholder="Path e.g. Linux → Enumeration → Privilege Escalation">

    <textarea id="points"
        placeholder="Commands / Points - one point per line"></textarea>

    <button onclick="generateHTML()">
        Generate HTML
    </button>

    <textarea id="output"
        placeholder="Generated HTML will appear here..."></textarea>

    <button onclick="copyHTML()">
        Copy HTML
    </button>


<script>

function generateHTML() {

    let title = document.getElementById("title").value;
    let subtitle = document.getElementById("subtitle").value;
    let importance = document.getElementById("importance").value;
    let notes = document.getElementById("notes").value;
    let path = document.getElementById("path").value;
    let points = document.getElementById("points").value;

    let notesList = notes
        .split("\n")
        .filter(x => x.trim() !== "")
        .map(x => "            <li>" + x + "</li>")
        .join("\n");

    let pointsList = points
        .split("\n")
        .filter(x => x.trim() !== "")
        .map(x => "            <li>" + x + "</li>")
        .join("\n");


    let html = `<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>${title}</title>

</head>

<body>

    <div class="box">

        <h1>${title}</h1>

        <p>${subtitle}</p>

    </div>


    <div class="box">

        <h2>Importance</h2>

        <p>
            ${importance}
        </p>

    </div>


    <div class="box">

        <h2>Notes</h2>

        <ul>

${notesList}

        </ul>

    </div>


    <div class="box">

        <h2>Path</h2>

        <div class="path">

            ${path}

        </div>

    </div>


    <div class="box">

        <h2>Points</h2>

        <ul>

${pointsList}

        </ul>

    </div>


</body>

</html>`;

    document.getElementById("output").value = html;
}


function copyHTML() {

    let output = document.getElementById("output");

    output.select();

    navigator.clipboard.writeText(output.value);

    alert("HTML copied!");

}

</script>

</body>
</html>
